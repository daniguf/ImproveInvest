name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next-env.d.ts` is gitignored, so a fresh clone has no declarations for
      # static image imports and `tsc` fails with TS2307. Next regenerates the
      # file, but only on `next dev` / `next build`, neither of which runs here.
      # `typegen` writes it without building, so it needs no credentials.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # The test suite runs the Storybook stories in headless Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

# `npm run build` is intentionally not part of this workflow: it queries the
# Sanity dataset from generateStaticParams and constructs the Resend client at
# module scope, so it needs real Sanity and Resend credentials. The deploy
# pipeline owns it.
